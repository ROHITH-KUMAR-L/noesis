[project]
name = "memory-rl"
version = "0.1.0"
description = "Budget-constrained reinforcement learning for task-critical memory retention in multi-step AI agents."
readme = "README.md"
requires-python = ">=3.11"
# Dependencies are added only when a phase actually needs them (plan.md §5).
# tiktoken backs the Phase 1 tokenizer; the answerer's tokenizer must match it.
dependencies = [
    "tiktoken>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
]

[project.scripts]
noesis-smoke = "memory_rl.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_rl"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
warn_unused_configs = true
ignore_missing_imports = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "smoke: fast checks that must stay cheap enough for CI and the Docker entrypoint",
]
