# Phase 6 PPO controller on the toy benchmark (mock LLM). Starting values for
# pipeline validation; keep_bias was chosen on the VALID split (sweep 1.0/1.5/2.0,
# seed 0, 100 updates) and is not tuned beyond that.
env: toy
profile: anthropic-sonnet-5-5
variant: cache          # cache | token (comparison controller)
lam: 1.0                # swept: 0.3, 1, 3
seed: 0
updates: 200
validate_every: 10
valid_tasks: 30
tokenizer: o200k_base
out: checkpoints
keep_bias: 1.0
no_edit_bias: 1.0
ppo:
  episodes_per_update: 32
  epochs: 4
  minibatch_size: 128
  clip: 0.2
  gamma: 1.0
  gae_lambda: 0.95
  entropy_coef: 0.01
  value_coef: 0.5
  lr: 0.0003
  max_grad_norm: 0.5
